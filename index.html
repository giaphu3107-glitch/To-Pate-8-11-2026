<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật Công Chúa Của Anh! ❤️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }     
        body {
            background: linear-gradient(135deg, #ffe5ec, #ffb3c6);
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            text-align: center;
        }
        /* Màn hình 1: Hộp quà bí ẩn */
        .gift-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s;
        }
        .gift-container:hover { transform: scale(1.05); }
        .box {
            font-size: 100px;
            animation: bounce 1.5s infinite;
        }
        .gift-text {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #d90429;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
        /* Màn hình 2: Nội dung chính */
        .main-content {
            display: none;
            max-width: 600px;
            padding: 20px;
            animation: fadeIn 2s ease-in-out forwards;
        }
        h1 {
            color: #d90429;
            font-size: 2.5rem;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        /* Album ảnh kỷ niệm */
        .album {
            width: 100%;
            height: 250px;
            position: relative;
            margin: 30px 0;
            perspective: 1000px;
        }
        .img-card {
            width: 200px; 
            height: 250px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border: 8px solid #fff;
            border-bottom: 30px solid #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border-radius: 4px;
            transition: transform 0.5s ease;
            background-size: cover;
            background-position: center;
        }
        /* Lời chúc chạy chữ */
        .wishes {
            font-size: 1.3rem;
            color: #4a0010;
            line-height: 1.6;
            min-height: 80px;
            font-style: italic;
            font-weight: 500;
        }
        /* Hiệu ứng rơi (Tim/Pháo hoa) */
        .heart {
            position: fixed;
            font-size: 20px;
            color: #ff4d6d;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 999;
        }
        /* Keyframes Animations */
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH 1: HỘP QUÀ BÍ ẨN -->
    <div class="gift-container" id="giftScreen" onclick="openGift()">

        <p class="gift-text">Có một món quà đặc biệt dành riêng cho Công Chúa. Ấn vào đây để mở nhé! ❤️</p>
    </div>

    <!-- NHẠC NỀN (Thay link nhạc của bạn tại đây) -->
    <audio id="bgMusic" src="https://googleapis.com" loop></audio>




    <script>
        // Danh sách lời chúc ý nghĩa
        const messages = [
            "Chúc mừng sinh nhật thiên thần bé nhỏ của anh! 🌟",
            "Cảm ơn em vì đã đến, sưởi ấm trái tim anh và mang lại thật nhiều hạnh phúc.",
            "Chúc em tuổi mới luôn mỉm cười rạng rỡ, luôn xinh đẹp và bình an bên anh nhé.",
            "Yêu thương em nhiều hơn mỗi ngày! 💕 Đố em bấm vào các bức ảnh để lật xem đấy!"
        ];

           // Hàm mở hộp quà kèm cơ chế ép phát nhạc chủ động
        function openGift() {
            // Khai báo tệp nhạc chuẩn từ máy chủ Google Firebase ổn định
            const music = document.getElementById('bgMusic');
            music.src = "https://googleapis.com";
            
            // Ép phát nhạc chủ động ngay khi người dùng click
            music.play().then(() => {
                console.log("Nhạc đã phát thành công!");
            }).catch(e => {
                console.log("Trình duyệt chặn phát âm thanh tự động, cần tương tác mạnh hơn.");
            });

            // Chuyển màn hình giao diện sang Album ảnh
            document.getElementById('giftScreen').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'block';

            // Kích hoạt hiệu ứng chữ chạy và tim rơi lãng mạn
            setInterval(createHeart, 300);
            startTyping();
        }

        // Hiệu ứng gõ chữ tự động (Typewriter)
        let msgIndex = 0;
        let charIndex = 0;
        function startTyping() {
            if (msgIndex < messages.length) {
                let currentMsg = messages[msgIndex];
                if (charIndex < currentMsg.length) {
                    document.getElementById('typingText').innerHTML += currentMsg.charAt(charIndex);
                    charIndex++;
                    setTimeout(startTyping, 70); // Tốc độ gõ chữ
                } else {
                    setTimeout(() => {
                        document.getElementById('typingText').innerHTML = "";
                        charIndex = 0;
                        msgIndex++;
                        if(msgIndex === messages.length) msgIndex = 0; // Vòng lặp lại lời chúc
                        startTyping();
                    }, 2500); // Thời gian chờ trước khi chuyển câu mới
                }
            }
        }

        // Hiệu ứng tạo trái tim rơi lãng mạn
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = ['❤️','💖','🌸','✨','✨'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '-20px';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }

        // Logic tương tác lật ảnh
        let cards = document.querySelectorAll('.img-card');
        function swapCard() {
            let album = document.querySelector('.album');
            let firstCard = album.firstElementChild;
            firstCard.style.zIndex = "3";
            // Đảo vị trí các thẻ để tạo cảm giác lật album ảnh liên tục
            album.appendChild(firstCard);
            setTimeout(() => {
                document.querySelectorAll('.img-card').forEach((c, idx) => {
                    c.style.zIndex = idx === 2 ? "2" : "1";
                });
            }, 100);
        }
        // Gắn sự kiện click cho album ảnh
        document.querySelector('.album').addEventListener('click', swapCard);
    </script>
</body>
</html>
