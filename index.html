<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật Công Chúa Của Anh! ❤️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #ffe5ec, #ffb3c6);
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            text-align: center;
            position: relative;
        }
        /* MÀN HÌNH 1: HỘP QUÀ BÍ ẨN */
        .gift-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: transform 0.3s;
            z-index: 10;
        }
        .gift-container:hover { transform: scale(1.05); }
        .box { font-size: 100px; animation: bounce 1.5s infinite; }
        .gift-text {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #d90429;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
            padding: 0 15px;
        }

        /* MÀN HÌNH 1.5: CÂU HỎI TỎ TÌNH TĂNG CƯỜNG */
        .question-container {
            display: none;
            background: rgba(255, 255, 255, 0.9);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            z-index: 10;
        }
        .question-text {
            font-size: 1.3rem;
            color: #d90429;
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            min-height: 60px;
            position: relative;
        }
        .btn {
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        #btnYes { background-color: #4caf50; color: white; transition: transform 0.1s; }
        #btnYes:hover { transform: scale(1.1); }
        #btnNo { background-color: #f44336; color: white; position: absolute; transition: all 0.2s ease; }

        /* MÀN HÌNH 2: NỘI DUNG CHÍNH */
        .main-content {
            display: none;
            max-width: 600px;
            padding: 20px;
            animation: fadeIn 2s ease-in-out forwards;
        }
        h1 {
            color: #d90429;
            font-size: 2.5rem;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        .album {
            width: 100%;
            height: 250px;
            position: relative;
            margin: 30px 0;
            perspective: 1000px;
            cursor: pointer;
        }
        .img-card {
            width: 200px;
            height: 250px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border: 8px solid #fff;
            border-bottom: 30px solid #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border-radius: 4px;
            transition: transform 0.5s ease, z-index 0.1s;
            background-size: cover;
            background-position: center;
        }
        .wishes { font-size: 1.3rem; color: #4a0010; line-height: 1.6; min-height: 80px; font-style: italic; font-weight: 500; }
        .heart { position: fixed; font-size: 20px; color: #ff4d6d; pointer-events: none; animation: fall linear forwards; z-index: 999; }
        
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
        @keyframes fall { to { transform: translateY(105vh) rotate(360deg); opacity: 0; } }
    </style>
</head>
<body>

    <!-- MÀN HÌNH 1: HỘP QUÀ BÍ ẨN -->
    <div class="gift-container" id="giftScreen" onclick="openGift()">
        <div class="box">🎁</div>
        <p class="gift-text">Có một món quà đặc biệt dành riêng cho Công Chúa. Ấn vào đây để mở nhé! ❤️</p>
    </div>

    <!-- MÀN HÌNH 1.5: CÂU HỎI YES/NO CHẠY TRỐN -->
    <div class="question-container" id="questionScreen">
        <p class="question-text">Đây là năm thứ 2 anh đón sinh nhật cùng em. Em có muốn đón sinh nhật cùng anh tiếp những năm sau đó không? ❤️</p>
        <div class="btn-group">
            <button class="btn" id="btnYes" onclick="selectYes()">Yes! 😍</button>
            <button class="btn" id="btnNo" onmouseover="flyNo()" onclick="flyNo()">No 😢</button>
        </div>
    </div>

    <!-- MÀN HÌNH 2: NỘI DUNG CHÚC MỪNG CHÍNH CHỨA 6 ẢNH -->
    <div class="main-content" id="mainScreen">
        <h1>Happy Birthday, My Girl! 🎂✨</h1>
        
        <div class="album">
            <!-- Thay link 6 ảnh của bạn vào đây nhé -->
            <div class="img-card" style="background-image: url('blob:https://www.facebook.com/2f318222-040d-4685-a3d0-e95c7966daef'); transform: translateX(-50%) rotate(-12deg); z-index: 1;"></div>
            <div class="img-card" style="background-image: url('blob:https://www.facebook.com/2dc5c1a4-45bc-4a5f-8602-25d2acd98ea6'); transform: translateX(-50%) rotate(8deg); z-index: 1;"></div>
            <div class="img-card" style="background-image: url('blob:https://www.facebook.com/1c40d644-4890-40ad-b8aa-1c9647b537b0'); transform: translateX(-50%) rotate(-5deg); z-index: 1;"></div>
            <div class="img-card" style="background-image: url('blob:https://www.facebook.com/c32fd471-f3fd-47a9-aaed-869ab8491cdf'); transform: translateX(-50%) rotate(6deg); z-index: 1;"></div>
            <div class="img-card" style="background-image: url('blob:https://www.facebook.com/9d71c06f-8135-4887-b119-b7379b77eabc'); transform: translateX(-50%) rotate(-9deg); z-index: 1;"></div>
            <div class="img-card" id="topCard" style="background-image: url('blob:https://www.facebook.com/8c8143e7-f694-416a-8611-02fa0b14b703'); transform: translateX(-50%) rotate(3deg); z-index: 2;"></div>
        </div>

        <p class="wishes" id="typingText"></p>
    </div>

    <!-- NHẠC NỀN CHUẨN BÀI BÌNH YÊN (GOOGLE FIREBASE) -->
    <audio id="bgMusic" src="https://googleapis.com" loop></audio>

    <script>
        const messages = [
            "Chúc mừng sinh nhật thiên thần bé nhỏ của anh! 🌟",
            "Cảm ơn em vì đã lựa chọn đi cùng anh, sưởi ấm trái tim anh và mang lại thật nhiều hạnh phúc.",
            "Chúc Pate tuổi mới luôn mỉm cười rạng rỡ, luôn xinh đẹp và bình an bên anh nhé.",
            "Yêu thương em nhiều hơn mỗi ngày! 💕 Đố em bấm vào các bức ảnh để lật xem đấy!"
        ];

        const music = document.getElementById('bgMusic');
        const btnNo = document.getElementById('btnNo');
        
        btnNo.style.left = "160px"; // Đặt vị trí ban đầu nút No chuẩn xác

        // Kích hoạt nhạc nền khi có tương tác chạm bất kì
        function playAudio() {
            music.play().catch(e => console.log("Chờ tương tác..."));
        }
        document.addEventListener('click', playAudio);
        document.addEventListener('touchstart', playAudio);

        // BƯỚC 1: Bấm hộp quà chuyển sang màn hình câu hỏi Yes/No
        function openGift() {
            document.getElementById('giftScreen').style.display = 'none';
            document.getElementById('questionScreen').style.display = 'block';
            playAudio();
        }

        // BƯỚC 1.5: Nút No tự động nhảy trốn
        function flyNo() {
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight - 40) + 20;
            btnNo.style.position = "fixed";
            btnNo.style.left = x + "px";
            btnNo.style.top = y + "px";
        }

        // BƯỚC 2: Bấm chọn YES -> Mở khóa nhạc và hiện album quà tặng sinh nhật
        function selectYes() {
            document.getElementById('questionScreen').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'block';
            
            // Kích hoạt phát nhạc 100% thành công nhờ cú click vào nút Yes
            music.play().then(() => {
                document.removeEventListener('click', playAudio);
                document.removeEventListener('touchstart', playAudio);
            });

            setInterval(createHeart, 300);
            startTyping();
        }

        // Hiệu ứng chữ chạy tự động
        let msgIndex = 0; let charIndex = 0;
        function startTyping() {
            if (msgIndex < messages.length) {
                let currentMsg = messages[msgIndex];
                if (charIndex < currentMsg.length) {
                    document.getElementById('typingText').innerHTML += currentMsg.charAt(charIndex);
                    charIndex++;
                    setTimeout(startTyping, 70);
                } else {
                    setTimeout(() => {
                        document.getElementById('typingText').innerHTML = "";
                        charIndex = 0; msgIndex++;
                        if(msgIndex === messages.length) msgIndex = 0;
                        startTyping();
                    }, 2500);
                }
            }
        }

        // Tạo trái tim rơi
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = ['❤️','💖','🌸','✨'][Math.floor(Math.random() * 4)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '-20px';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
heart.style.animationDuration = Math.random() * 3 + 2 + 's';
document.body.appendChild(heart);
setTimeout(() => { heart.remove(); }, 5000);
}
// Logic tương tác lật bộ ảnh album
function swapCard() {
let album = document.querySelector('.album');
let firstCard = album.firstElementChild;
let topCard = album.lastElementChild;
topCard.style.zIndex = "1";
album.insertBefore(topCard, firstCard);
setTimeout(() => {
let currentCards = document.querySelectorAll('.img-card');
currentCards.forEach((c, idx) => {
if (idx === currentCards.length - 1) { c.style.zIndex = "2"; }
else { c.style.zIndex = "1"; }
});
}, 50);
}
document.querySelector('.album').addEventListener('click', swapCard);
