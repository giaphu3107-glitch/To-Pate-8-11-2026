<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chúc Mừng Sinh Nhật Công Chúa Của Anh! ❤️</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: linear-gradient(135deg, #ffe5ec, #ffb3c6);
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            text-align: center;
            position: relative;
        }
        /* MÀN HÌNH 1: CÂU HỎI TỎ TÌNH */
        .question-container {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px 20px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 90%;
            z-index: 10;
            transition: all 0.5s ease;
        }
        .question-text {
            font-size: 1.4rem;
            color: #d90429;
            font-weight: bold;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            min-height: 60px;
            position: relative;
        }
        .btn {
            padding: 12px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        #btnYes {
            background-color: #4caf50;
            color: white;
        }
        #btnYes:hover { transform: scale(1.1); }
        #btnNo {
            background-color: #f44336;
            color: white;
            position: absolute;
            transition: all 0.2s ease;
        }

        /* MÀN HÌNH 2: NỘI DUNG CHÍNH (ẨN LÚC ĐẦU) */
        .main-content {
            display: none;
            max-width: 600px;
            padding: 20px;
            animation: fadeIn 2s ease-in-out forwards;
        }
        h1 {
            color: #d90429;
            font-size: 2.5rem;
            margin-bottom: 20px;
            animation: pulse 2s infinite;
        }
        /* Album ảnh kỷ niệm */
        .album {
            width: 100%;
            height: 250px;
            position: relative;
            margin: 30px 0;
            perspective: 1000px;
            cursor: pointer;
        }
        .img-card {
            width: 200px;
            height: 250px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            border: 8px solid #fff;
            border-bottom: 30px solid #fff;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            border-radius: 4px;
            transition: transform 0.5s ease, z-index 0.1s;
            background-size: cover;
            background-position: center;
        }
        /* Lời chúc chạy chữ */
        .wishes {
            font-size: 1.3rem;
            color: #4a0010;
            line-height: 1.6;
            min-height: 80px;
            font-style: italic;
            font-weight: 500;
        }
        /* Hiệu ứng tim rơi */
        .heart {
            position: fixed;
            font-size: 20px;
            color: #ff4d6d;
            pointer-events: none;
            animation: fall linear forwards;
            z-index: 999;
        }
        /* Keyframes Animations */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <!-- MÀN HÌNH 1: CÂU HỎI TRANG ĐẦU -->
    <div class="question-container" id="questionScreen">
        <p class="question-text">Đây là năm thứ 2 anh đón sinh nhật cùng em. Em có muốn đón sinh nhật cùng anh tiếp những năm sau đó không? ❤️</p>
        <div class="btn-group">
            <button class="btn" id="btnYes" onclick="selectYes()">Yes! 😍</button>
            <button class="btn" id="btnNo" onmouseover="flyNo()" onclick="flyNo()">No 😢</button>
        </div>
    </div>

    <!-- NHẠC NỀN GOOGLE FIREBASE (Bản chuẩn bài "Bình Yên" - Vũ ft. Binz) -->
    <audio id="bgMusic" src="https://googleapis.com" loop></audio>

    <script>
        // Danh sách lời chúc tự động gõ chữ ở màn hình 2
        const messages = [
            "Chúc mừng sinh nhật thiên thần bé nhỏ của anh! 🌟",
            "Cảm ơn em vì đã lựa chọn đi cùng anh, sưởi ấm trái tim anh và mang lại thật nhiều hạnh phúc.",
            "Chúc Pate tuổi mới luôn mỉm cười rạng rỡ, luôn xinh đẹp và bình an bên anh nhé.",
            "Yêu thương em nhiều hơn mỗi ngày! 💕 Đố em bấm vào các bức ảnh để lật xem đấy!"
        ];

        const music = document.getElementById('bgMusic');
        const btnNo = document.getElementById('btnNo');

        // Lỗi vị trí ban đầu nút No
        btnNo.style.left = "160px";

        // Hàm xử lý khi di chuột hoặc chạm vào nút NO -> Nút tự nhảy đi chỗ khác
        function flyNo() {
            // Tính toán khoảng cách ngẫu nhiên trong phạm vi màn hình điện thoại/máy tính
            const x = Math.random() * (window.innerWidth - btnNo.offsetWidth - 40) + 20;
            const y = Math.random() * (window.innerHeight - btnNo.offsetHeight - 40) + 20;
            
            // Ép nút bay ra khỏi khung cha, chuyển thành vị trí cố định trên màn hình
            btnNo.style.position = "fixed";
            btnNo.style.left = x + "px";
            btnNo.style.top = y + "px";
        }

        // Hàm xử lý khi chọn YES -> Chuyển trang và Phát nhạc
        function selectYes() {
            // 1. Ẩn màn câu hỏi, hiện màn quà tặng
            document.getElementById('questionScreen').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'block';

            // 2. Ép trình duyệt phát tiếng bài "Bình Yên" ngay lập tức nhờ hành động Click
            music.play().then(() => {
                console.log("Phát nhạc thành công!");
            }).catch(e => console.log("Lỗi chặn âm thanh:", e));

            // 3. Chạy các hiệu ứng mừng sinh nhật
            setInterval(createHeart, 300);
            startTyping();
        }

        // Hiệu ứng gõ chữ tự động (Typewriter)
        let msgIndex = 0;
        let charIndex = 0;
        function startTyping() {
            if (msgIndex < messages.length) {
                let currentMsg = messages[msgIndex];
                if (charIndex < currentMsg.length) {
                    document.getElementById('typingText').innerHTML += currentMsg.charAt(charIndex);
                    charIndex++;
                    setTimeout(startTyping, 70);
                } else {
                    setTimeout(() => {
                        document.getElementById('typingText').innerHTML = "";
                        charIndex = 0;
                        msgIndex++;
                        if(msgIndex === messages.length) msgIndex = 0;
                        startTyping();
                    }, 2500);
                }
            }
        }

        // Hiệu ứng tạo trái tim rơi lãng mạn
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = ['❤️','💖','🌸','✨','✨'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = '-20px';
            heart.style.fontSize = Math.random() * 15 + 15 + 'px';
            heart.style.animationDuration = Math.random() * 3 + 2 + 's';
            document.body.appendChild(heart);
            setTimeout(() => { heart.remove(); }, 5000);
        }
